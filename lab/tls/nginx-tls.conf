# Replaces nginx's shipped `default.conf` in the `tls-web` service, so that
# host serves 443 and does NOT serve 80. That asymmetry against `web-nginx`
# (80 open, 443 closed) is deliberate: it is what makes a false-positive
# assertion mean something.
#
# The certificate and key are generated into the `labtls` volume by the
# `tls-init` service at `lab/run.sh up` time. No key material is ever stored
# in this repository.
server {
    listen 443 ssl;
    server_name tls-web.lab.invalid;

    ssl_certificate     /etc/nginx/tls/lab.crt;
    ssl_certificate_key /etc/nginx/tls/lab.key;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }
}
