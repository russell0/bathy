[package]
name = "bathy-engine"
description = "bathy's emission path: the rate limiter, budget governance, and scheduler that put probes on the wire."
version.workspace = true
edition.workspace = true
# MSRV tiering: this crate now depends on `bathy-store` (`TaskStore`, needed
# by `scheduler.rs`'s resumption cursor), which is the one crate in this
# workspace that needs a rustc newer than the shared `1.88` floor --
# `rusqlite`'s `bundled` feature pulls in `libsqlite3-sys`, whose build
# script needs a rustc with `cfg_select!` (stable at 1.97.1, unstable-gated
# below that, absent at 1.88 -- see the MSRV comment on `bathy-store`'s own
# `Cargo.toml` for the exact floor and how `1.95` was measured). A crate
# that depends on `bathy-store`, even transitively, needs that same higher
# floor to build at all, so this crate now declares the same literal
# `rust-version = "1.95"` rather than inheriting the workspace's `1.88`.
# CI's `msrv-bathy-store` job (`.github/workflows/ci.yml`) now checks this
# crate too, not just `bathy-store` itself, and this crate has moved OUT of
# the plain `msrv` (`1.88`) job -- verified locally against both toolchains
# (see this task's report), not just asserted here.
#
# (An earlier version of this comment argued this crate would move tiers
# only once it depended on `bathy-store` for real, dismissing that as
# premature for the rate-limiter-only work in an earlier task. That
# dependency now exists -- `scheduler.rs` is exactly the "budget-governed
# emission work" that comment already anticipated -- so the move happens
# here, in M3 Task 7, not "M3 Task 8": the plan this workspace follows has
# no task by that number, an earlier mislabeling now corrected everywhere
# it appeared, including in the workspace `Cargo.toml`'s own `tokio` entry.)
rust-version = "1.95"
license.workspace = true
repository.workspace = true

[dependencies]
# M4 Task 5: `scheduler.rs` now reconnects to an `Open` endpoint itself (see
# `Scheduler::detect_service`) and drives a `bathy_probe::Probe` over that
# second socket by hand, which needs `AsyncReadExt`/`AsyncWriteExt` the same
# way `bathy-probe`'s own `ProbeIo` does -- see that crate's `Cargo.toml` for
# the exact error this feature avoids. Declared explicitly here rather than
# relied upon via Cargo's feature unification with the `bathy-probe`
# dependency below (which would also happen to supply it): this crate's own
# test harness (`scheduler.rs`'s `#[cfg(test)] mod tests`) uses
# `AsyncReadExt`/`AsyncWriteExt` directly too, so it is a real, direct need
# of this crate, not merely an incidental grant from what another crate in
# the graph happens to request.
tokio = { workspace = true, features = ["io-util"] }
# AC-3.24-3.30 (`scheduler.rs`): cooperative cancellation.
tokio-util = { workspace = true }
thiserror = { workspace = true }
bathy-types = { workspace = true }
bathy-scope = { workspace = true }
bathy-evidence = { workspace = true }
bathy-store = { workspace = true }
bathy-plan = { workspace = true }
# M4 Task 5: the probe framework and rule registry `scheduler.rs`'s
# `Scheduler::detect_service` wires into the scan loop. Both sit below
# `bathy-engine` in `xtask`'s `LAYERS` (`..., bathy-interpret, bathy-probe,
# bathy-engine, ...`), so this is a downhill dependency, not a violation of
# the layer order `check-deps` enforces.
bathy-probe = { workspace = true }
bathy-interpret = { workspace = true }
# OPTIONAL, and pulled in by nothing but the `test-util` feature below --
# `cargo build -p bathy-engine` and every consumer that does not ask for
# `test-util` resolve exactly the graph they did before, which is checkable
# with `cargo tree -p bathy-engine` and is why this is not simply a normal
# dependency. It has to be reachable from a NON-dev build because
# `src/test_support.rs` is now `pub` behind that feature (see `src/lib.rs`),
# and a crate above this one reaches this one through `[dependencies]`, where
# this crate's own `[dev-dependencies]` do not exist. The `[dev-dependencies]`
# entry below stays: this crate's own `cfg(test)` build does not turn
# `test-util` on, and `connect.rs`'s `EADDRNOTAVAIL` test needs `socket2`
# regardless of any feature.
socket2 = { version = "0.6", optional = true }

[dev-dependencies]
# M3 whole-branch review, CRITICAL-1: `ScopeManifest::for_tests_allowing_loopback`
# (`bathy-scope`) is what lets this crate's scheduler tests build a manifest
# that authorizes the real `127.0.0.1` sockets those tests drive -- see that
# constructor's own doc comment, and `bathy-scope/Cargo.toml`'s `test-util`
# feature comment, for why a `[dev-dependencies]` edge (rather than enabling
# the feature on the `[dependencies]` edge above) is what keeps this
# reachable from this crate's own tests without ever reaching a normal,
# non-test build of this crate.
bathy-scope = { path = "../bathy-scope", features = ["test-util"] }
# `test-util` is additive on top of the `[dependencies]` feature set above
# (Cargo features only ever union) and is needed by several test targets:
# `#[tokio::test(start_paused = true)]` (the rate limiter's sustained-rate
# test, and `scheduler`/`durable_log`'s own paused-clock tests, so they run
# on a simulated clock instead of sleeping for real) requires it to compile
# at all.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# M3 Task 7 fix round 1, IMPORTANT-4: `connect.rs`'s
# `classifies_a_genuine_os_produced_addrnotavailable_error` test needs to
# bind a socket's LOCAL address to a specific (unowned) address to trigger a
# genuine, OS-produced `EADDRNOTAVAIL` -- `std`/`tokio`'s own `TcpStream`
# types expose no way to choose an outbound socket's local address before
# connecting. Already resolved in this workspace's dependency tree
# (`libsqlite3-sys` -> `mio` -> `socket2` -- see `cargo tree -p bathy-engine`
# in this task's report), so this adds no new supply-chain surface, only a
# direct `[dev-dependencies]` edge onto a crate already present at this
# exact version.
#
# Second reason, added with `src/test_support.rs`: `closed_port` reserves a
# loopback port that refuses connections, by holding an established
# connection whose listener has been closed -- and the listener it starts
# from must NOT set `SO_REUSEADDR`, or on Linux the reservation can be
# shared away and the whole fixture is pointless. `std` and `tokio` both set
# it unconditionally and expose no way off; `socket2` is what lets a
# listener be created without it. Same argument as above applies unchanged:
# no new supply-chain surface, an edge onto a crate already in the graph.
socket2 = "0.6"

[features]
# M3 whole-branch re-review, CRITICAL-2 item 2: `GroupCommitLog::fail_next_sync_for_tests`
# (`src/durable_log.rs`) needs a registered feature name for its
# `cfg(any(test, feature = "test-util"))` gate, the same pattern
# `bathy-scope`'s own `test-util` feature uses for
# `ScopeManifest::for_tests_allowing_loopback` -- see that crate's
# `Cargo.toml` for the fuller reasoning. Declared here even though nothing
# outside this crate currently enables it (`cfg(test)` alone already covers
# this crate's own tests): Cargo's `unexpected_cfgs` lint requires a
# `feature` name referenced in a `cfg` to be declared in `[features]`, and
# an undeclared-but-referenced feature name is exactly the kind of drift
# this lint exists to catch.
#
# It now also exposes `pub mod test_support` (`closed_port`), which is why
# it carries `dep:socket2`: that module cannot compile without it, and a
# feature that turns on a module while leaving its dependency to chance is a
# build that works only where something else happened to enable it.
test-util = ["dep:socket2"]
