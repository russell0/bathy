[package]
name = "bathy-packetd"
version.workspace = true
edition.workspace = true
# The 1.88 tier, and measured in both directions before this line was written
# (this project has given a crate an unchecked floor three times -- see the
# comments on the two `msrv` jobs in `.github/workflows/ci.yml`):
# `cargo +1.88 check -p bathy-packetd --all-targets` passes and
# `cargo +1.95 check -p bathy-packetd --all-targets` passes, so the floor this
# crate promises is real and `1.88` is the job that has to check it. Nothing
# here reaches `bathy-store` or `libsqlite3-sys`, and nothing here is allowed
# to: a privileged process with a C build script in its dependency graph is a
# privileged process nobody can review. Named in the `msrv` job and in no
# other.
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The dependency graph of the ONLY privileged component in this workspace, and
# the shortest one in it. Every crate here is either a parser this protocol
# cannot avoid or a type it would otherwise hand-roll:
#
# - `serde`/`serde_json`: the line protocol is line-delimited JSON, and the
#   deserializer is what makes an unparseable target address or an out-of-range
#   port a *parse failure* (AC-6.4, fatal) rather than a validation step
#   somebody has to remember to write. Keeping the refusal in the type is the
#   whole reason this crate has almost no validation logic of its own.
# - `ipnet`: the same CIDR parser `bathy-scope` uses, for the same reason --
#   a malformed CIDR in `Init` must be fatal at the boundary, not later.
#   Sharing the *parser* is not sharing the *policy*: AC-6.9's independent
#   scope check (Task 3) shares no code with `bathy-scope`.
# - `thiserror`: the error types this crate's public API returns.
#
# Deliberately NOT `bathy-types`, though `LAYERS` in `xtask` would permit it.
# `PortState` here is three lines of local enum with the same wire strings
# (asserted by a test); depending on `bathy-types` for it would drag
# `schemars`, `blake3`, `ulid` and `time` into the address space that opens
# raw sockets. The duplication is four variants; the alternative is four
# crates.
#
# M6 Task 2 adds the socket and capability halves, on the same rule. Both are
# crates that already own the syscall behind a safe API, which is why this
# crate ends up with exactly one `unsafe` block rather than a file of them:
#
# - `socket2`: `Socket::new(Domain::IPV4, Type::RAW, ..)` IS `socket(2)`, and
#   `set_header_included_v4` IS `setsockopt(IP_HDRINCL)`. Pure syscall
#   wrapper over `libc`, no build script, MSRV 1.70.
# - `caps`: `caps::clear` IS `capset(2)`, over all five capability sets. Pure
#   `libc`, no build script, MSRV 1.63. Linux-only, hence the target table
#   below -- there is no capability model to drop on macOS, and `privilege.rs`
#   fails closed there rather than pretending there is.
# - `libc`: for the one syscall neither of the above exposes,
#   `prctl(PR_SET_NO_NEW_PRIVS, ...)`. It is already in this graph twice as a
#   transitive dependency of the other two, so naming it directly adds no
#   crate to the address space that opens raw sockets. Taking a fourth
#   wrapper crate instead, to avoid one argument-only `unsafe` block, would
#   have cost more review than the block does.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ipnet = { workspace = true }
socket2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# TEST ONLY, and the reason the local `PortState` above is a copy of a contract
# rather than a second contract: `the_wire_strings_match_bathy_types` compares
# the two enums' serialized forms. A dev-dependency edge does not link into the
# privileged binary, so the graph that opens raw sockets stays the four crates
# listed above.
bathy-types = { path = "../bathy-types" }
# TEST ONLY, and the reason `syn.rs`'s scope check is worth writing twice.
# AC-6.9 requires `packetd` to enforce scope with logic independent of
# `bathy-scope`; two implementations of one policy are worth nothing unless
# somebody checks that they agree, so
# `the_two_scope_implementations_agree_on_every_generated_address` drives
# generated CIDRs and addresses through both and fails on any disagreement.
# A dev-dependency edge does not link into the privileged binary: the graph
# that opens raw sockets is still the five crates listed above.
bathy-scope = { path = "../bathy-scope" }
