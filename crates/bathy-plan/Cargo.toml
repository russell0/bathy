[package]
name = "bathy-plan"
description = "Scan planning for bathy: target expansion, port selection, and the deterministic indexable scan plan."
version.workspace = true
edition.workspace = true
# MSRV tiering: this crate depends on nothing that needs more than the
# workspace floor (see the MSRV comment on the workspace `Cargo.toml` and on
# `bathy-store`'s, which is the one crate that needs a higher literal
# floor). `bathy-plan` does not depend on `bathy-store`, so it stays in the
# 1.88 tier and inherits the workspace value rather than declaring its own.
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bathy-types = { workspace = true }
ipnet = { workspace = true }
thiserror = { workspace = true }
# `plan.rs` assembles the canonical JSON document `plan_digest` hashes
# (`serde_json::json!`) and strips the raw `targets`/`ports`/`idempotency_key`
# fields out of the serialized request first (`serde_json::to_value` +
# `Map::remove`) -- both directly `use serde_json::...`, so it must be a
# direct dependency here, not just a transitive one pulled in through
# `bathy-types`.
serde_json = { workspace = true }

[dev-dependencies]
# M7 Task 3 (AC-7.15): the criterion micro-benchmarks. `default-features =
# false` drops `plotters` and `rayon` -- this project publishes numbers, not
# HTML reports, and every crate admitted to the graph has to clear
# `cargo deny`'s licence check. `cargo_bench_support` is what lets
# `cargo bench` drive it at all.
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "plan_construction"
harness = false
