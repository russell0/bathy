[package]
name = "bathy-scope"
description = "The scope manifest: bathy's deny-by-default authorization boundary for every address a packet may reach."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bathy-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ipnet = { workspace = true }
time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
# M3 whole-branch review, CRITICAL-1: `ScopeManifest::for_tests_allowing_loopback`
# (see `src/manifest.rs`) needs to be reachable from OTHER crates' own test
# targets (`bathy-engine`'s scheduler tests drive real loopback sockets), not
# only from this crate's own `cfg(test)`, which does not turn on when this
# crate is compiled merely as another crate's dependency. This feature is the
# cross-crate door: enabled only via a `[dev-dependencies]` edge (see
# `bathy-engine/Cargo.toml`), which -- under this workspace's `resolver = "3"`
# (root `Cargo.toml`) -- Cargo does not fold into a normal, non-test build of
# anything that depends on this crate the ordinary way. No production binary
# this workspace ships ever enables it.
test-util = []
