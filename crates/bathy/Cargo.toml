[package]
name = "bathy"
version = "0.1.0-alpha.1"
description = "Agent-native network discovery: typed MCP tools, evidence-backed findings, deny-by-default scope enforcement."
readme = "README.md"
keywords = ["network", "scanner", "mcp", "security", "discovery"]
categories = ["network-programming", "command-line-utilities"]
edition.workspace = true
# MSRV tiering, moved in M5 Task 3 and verified by execution in both
# directions (not asserted): this crate had no dependencies at all until
# this task and correctly sat in CI's `1.88` `msrv` job. It now depends on
# `bathy-engine` -> `bathy-store` -> `libsqlite3-sys`, whose build script
# needs `cfg_select!` (see the MSRV comment on `crates/bathy-store/Cargo.toml`
# for the exact floor and how `1.95` was measured), so it declares the same
# literal `rust-version = "1.95"` `bathy-engine` does and has moved OUT of
# the `msrv` job into `msrv-bathy-store`.
#
# This crate is where the "declared floor that nothing checks" defect was
# introduced a second time -- M3 found it in `bathy-plan`, and M4
# reintroduced it here at creation by naming this crate in neither job. A
# crate that declares a floor must appear in exactly one of the two jobs,
# and moving a crate's floor means moving its job in the same commit.
rust-version = "1.95"
license.workspace = true
repository.workspace = true

# M5 Task 3. Until this task the crate deliberately shipped no binary, so
# `cargo install bathy` reported there was nothing to install rather than
# installing a stub. The name was reserved as a lib so that `cargo install
# bathy` gives users a `bathy` command directly -- publishing as `bathy-cli`
# would have made the install command and the installed command disagree.
[[bin]]
name = "bathy"
path = "src/main.rs"

[dependencies]
bathy-types = { path = "../bathy-types" }
bathy-scope = { path = "../bathy-scope" }
bathy-evidence = { path = "../bathy-evidence" }
bathy-store = { path = "../bathy-store" }
bathy-plan = { path = "../bathy-plan" }
bathy-interpret = { path = "../bathy-interpret" }
bathy-probe = { path = "../bathy-probe" }
bathy-engine = { path = "../bathy-engine" }
bathy-query = { path = "../bathy-query" }
# `bathy serve mcp` fronts this crate, and `scope validate` renders the same
# typed answer the `scope.validate` tool returns rather than a second one.
# The plan's Task 3 edit #1 assigned the subcommand to Task 4, "in the commit
# that adds the server it fronts"; `xtask`'s layer table already ranks
# `bathy-mcp` below `bathy` for exactly this edge.
bathy-mcp = { path = "../bathy-mcp" }
# `derive` for the command tree. `wrap_help` deliberately NOT enabled: it
# reflows help text to the terminal it is rendered in, and `--help` is where
# this CLI's exit-code table lives (AC-5.11) -- a documented contract a test
# reads back must not depend on the width of the window it was printed in.
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# `rt-multi-thread` on top of the workspace's shared feature set: the
# scheduler runs hundreds of probes concurrently and `#[tokio::main]`
# without it would put every one of them on one thread.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The same crate as the `[dependencies]` edge above, with `test-util` added
# for the tests only: it exposes `bathy_engine::test_support::closed_port_on`,
# which `tests/workflow.rs`'s `Lab` uses for the endpoint the workflow's
# filter has to exclude on `state`. That port used to be bound and dropped on
# the machine's *routable* IP, i.e. handed back to a pool shared with every
# process on the box. Feature unification does not carry this into
# `cargo build -p bathy`: dev-dependency features are resolved separately
# from normal ones, so the shipped binary's graph is unchanged. Same shape as
# `bathy-engine`'s own dev-dependency on `bathy-scope`'s `test-util`.
bathy-engine = { path = "../bathy-engine", features = ["test-util"] }
# Test-only. `crates/bathy/tests/mcp.rs` checks every tool result against the
# `outputSchema` its own tool published, and `pattern` is the keyword every
# identifier and digest in those schemas is constrained by -- 29 declarations
# across the 27 committed documents. A hand-rolled matcher for the three
# forms that exist today would be a guard covering the instances already
# known, which is the shape this project keeps being bitten by; a real engine
# covers a fourth pattern nobody has written yet. Already in this workspace's
# tree via `bathy-interpret` and `xtask`, so it adds no crate to the graph.
regex.workspace = true
