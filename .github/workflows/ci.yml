name: ci
on:
  push:
  pull_request:
  # The lab conformance job below runs on this schedule and on demand, and on
  # nothing else -- see its own comment for the cost that decides that.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # AC-7.15's four criterion benchmarks, executed rather than merely
      # compiled. `cargo test --workspace` above does NOT reach them: Cargo's
      # default target selection for `test` is lib, bins, tests and examples,
      # and benches are not in it. `cargo clippy --all-targets` above does
      # compile them, so a benchmark that stops building is already caught --
      # but a benchmark that builds and then panics at run time (the
      # `interpret` one reads `testdata/captures/` from disk, so a moved
      # corpus is exactly that) would not be, and a benchmark nobody can run
      # is a benchmark nobody runs.
      #
      # `--benches` with `harness = false` runs each criterion target in its
      # own `--test` mode: every benchmark executed once, no timing collected,
      # about a second. It is deliberately not a performance gate -- a
      # wall-clock threshold on a shared runner is a flaky test, and a flaky
      # test is one people learn to ignore. `check-bench` asserts this step
      # exists, because the claim "CI runs them" is exactly the kind of claim
      # this project has watched go quietly false.
      - run: cargo test --workspace --benches
      - run: cargo run -p xtask -- check-deps
      - run: cargo run -p xtask -- check-schemas
      # `README.md` was factually wrong at three consecutive milestone
      # reviews, and twice inside the fixes for those reviews -- the last
      # audit found the same connection-count error still standing in a third
      # location after two had been corrected, in the paragraph describing
      # what a scanned third party receives on their wire. Every other
      # invariant in this project is enforced by a test that dies; this one
      # was enforced by whoever last remembered to look. `check-readme` pins
      # the claims that are numbers with a source of truth in the tree
      # (connections per open port, the acceptance-criterion count, the
      # milestone count, the protocol count and set, which probes send no
      # bytes, the committed-schema count, the evidence caps) and the "What
      # works today" table against the actual membership of `crates/`. It
      # does not and cannot cover the prose guarantees -- `xtask/src/readme.rs`
      # ends with the list of what stays human-verified, and the Global
      # Constraint requiring a README audit at every milestone exit still
      # stands in full.
      - run: cargo run -p xtask -- check-readme
      # `check-readme` asks whether a number in the README is true.
      # `check-docs` asks a different question, over four files: does the
      # section that has to exist still exist, is it where its criterion says
      # it has to be, and does it still say the thing it was required to say.
      # AC-7.16 and AC-7.18 through AC-7.21 are all of that shape, and every
      # one of them would otherwise have been closed by a person reading the
      # file and reporting that it looked right -- which the Global
      # Constraints say closes nothing. It covers position as well as
      # presence: the authorized-use statement moving below another section is
      # a one-line edit that leaves every presence check green, and it is
      # exactly what AC-7.18 forbids. Like `check-readme`, it ends with a
      # written-out list of what it cannot see -- starting with whether any of
      # what those documents say is true.
      - run: cargo run -p xtask -- check-docs
      # The three forbidden-pattern rules -- no time/id generation outside
      # `Clock` (AC-2.1), no `unsafe` outside `bathy-packetd`, and the
      # unscoped determinism claim -- used to live here, as inline `grep`
      # pipelines and nowhere else. That is why the AC-2.1 rule was red from
      # `89142bf` (mid-M5) to the end of the milestone while six task reports
      # and a milestone review said it was green: every other gate in this
      # project is `cargo run -p xtask -- check-<something>`, so running "the
      # documented gate commands" never ran these. A check nobody can run
      # locally is a check that goes red and stays red.
      #
      # The rules, their patterns, their path exemptions and the reasoning for
      # each now live in `xtask/src/phrases.rs`, with unit tests that feed each
      # forbidden pattern in and assert it is caught with its file and line --
      # so the checker itself is checked, which a shell pipeline in a workflow
      # never was. This step is the single call site.
      - run: cargo run -p xtask -- check-phrases
      # The class the M7 flaky-test sweep found four times, in the four shapes
      # a checker can see: two tests computing the same scratch path, a port
      # bound and released and then relied on, a fixed scan range inside the
      # kernel's ephemeral window, and `/proc/self/*` read in a binary with
      # more than one test. Every one of them was found by a person reading
      # code, and three different people found the four -- which is this
      # project's standing signal to mechanize.
      #
      # It is NOT a claim that the class is now caught: wall-clock bounds and
      # ambient-environment preconditions cannot be reduced to a pattern, and
      # `fixtures::UNCHECKABLE` says so in the gate's own passing output so a
      # green run is not read as a stronger statement than it is.
      - run: cargo run -p xtask -- check-fixtures
      # `bathy-interpret` (M4 Task 3) may depend on `bathy-types` and `regex`
      # only -- no async runtime, no filesystem access, no clock, no randomness
      # of its own. That constraint is what lets M4 Task 4's replay corpus run
      # with the network interface down and M7's fuzz target run without
      # sockets (see that crate's own `src/lib.rs` doc comment).
      #
      # This was 32 lines of inline `run: |` shell, and the forbidden-crate
      # list lived only inside one `grep -iE` alternation -- structurally
      # identical to the three phrase greps that kept AC-2.1 red for half a
      # milestone while six reports called it green. The rules, the forbidden
      # list and the reason each crate is on it now live in
      # `xtask/src/gates.rs`, with unit tests that feed each forbidden crate in
      # and assert it is caught with its rationale. This step is the single
      # call site, and `check-ci` below refuses a new inline block.
      - run: cargo run -p xtask -- check-purity
      # The "No panics in parsing paths" Global Constraint. It said
      # `unwrap()`/`expect()`/indexing-slice panics were "denied by lint" in
      # `bathy-probe` and `bathy-interpret` -- from M1, in the indicative mood
      # -- and there was no such lint anywhere in the tree: not in either
      # crate's `lib.rs`, not in this file, not in any `Cargo.toml` lint table.
      # Six milestones of code were written against a guarantee that did not
      # exist, in the two crates whose input is by definition chosen by the
      # thing being scanned. Enabling it found 43 real hits, every one of them
      # a candidate panic on hostile input, including six `matched_span`
      # computations of the exact shape that has already produced one shipped
      # offset bug and seven mutants across three review rounds.
      #
      # The deny attributes themselves are enforced by `cargo clippy
      # --workspace --all-targets -- -D warnings` above -- that step is what
      # compiles the crates at all. This one holds the *claim* together: that
      # each covered crate still carries the attribute with every lint in it,
      # that every exception is site-level and says why (a crate-level
      # `#![allow]` would reproduce the exact defect), and that the
      # constraint's sentence in the overview names exactly the crates the tree
      # lints -- in both directions, so neither the document nor the code can
      # move without the other. What it cannot see is printed on every pass.
      - run: cargo run -p xtask -- check-panics
      # The membership rule the two MSRV jobs below state in a comment
      # (":a crate declaring a floor must appear in exactly one of these two
      # jobs"), made executable. It had NO executable form at all and three
      # recorded recurrences -- `bathy-plan` (M3), `crates/bathy` (M4) and
      # `bathy-mcp` (M5) were each given a floor and named in neither job, so
      # each promised downstream consumers a compiler version nothing built.
      # `check-msrv` also verifies that each job removes `rust-toolchain.toml`
      # (the repo pins `stable`, which otherwise wins and makes the job check
      # `stable` twice) and prints the exact `cargo +<toolchain> check` lines,
      # so the local invocation is derived rather than remembered.
      - run: cargo run -p xtask -- check-msrv
      # M6's exit criterion: `bathy-packetd` is under 800 lines of non-test
      # Rust. It is the only component that will hold CAP_NET_RAW and the only
      # one permitted `unsafe`, and the whole argument for trusting it is that
      # a person can read all of it. That criterion had no executable form --
      # the same shape as the five gates M5 closed and the MSRV membership
      # rule with three recurrences -- and a size constraint first measured at
      # milestone close-out is measured when the code is already too big to
      # move. It runs from M6 Task 1 rather than from M6 Task 5 for exactly
      # that reason. What the number counts, and what it cannot see, is
      # printed on every pass.
      - run: cargo run -p xtask -- check-packetd
      # AC-7.1, and the rule the M7 plan states in prose and nothing enforced.
      #
      # The integration lab is the oracle every downstream claim rests on --
      # M6's SYN/connect cross-validation, M7's benchmarks against other
      # scanners, and the reproducibility claim -- and it is an oracle only
      # because we know exactly what listens where. A bare tag in
      # `lab/docker-compose.yml` breaks that silently: the image moves, the
      # banners `bathy-interpret`'s rules are tested against change, and
      # nothing goes red. `check-lab` also holds `lab/ground-truth.json` to the
      # address plan the compose file actually assigns, because a WRONG ground
      # truth is worse than no lab at all -- it makes every future disagreement
      # look like our bug, or makes a real bug look like agreement.
      #
      # It reads text rather than talking to a daemon, so it runs here whether
      # or not this runner has Docker. The conformance suite itself (AC-7.2 to
      # AC-7.6) cannot: those tests are `#[ignore]`d, so `cargo test
      # --workspace` above lists them as ignored rather than pretending to
      # have run them, and `lab/run.sh test` is what runs them with
      # `BATHY_LAB_REQUIRED` set so an absent lab fails instead of skipping.
      - run: cargo run -p xtask -- check-lab
      # AC-7.11 to AC-7.15, the half that reads text.
      #
      # The comparison itself (`bench/compare.sh`) does NOT run here and is
      # not meant to: it needs the lab up -- about 2.8 GiB of pinned images --
      # and a wall-clock measurement taken on a shared, oversubscribed runner
      # is not a measurement. What runs here is the gate on the *published*
      # numbers: `check-bench` re-renders `docs/benchmarks.md`'s generated
      # block from the committed `bench/results.json` and fails on drift, and
      # separately fails if a scanner loses its row, if a command line is not
      # published verbatim, if a run carries a timing without a score, if a
      # category where bathy loses is dropped from the document, if the
      # scheduler's connect-timeout default has moved since the run was taken
      # (which makes every timing in it stale), or if one of AC-7.15's four
      # criterion benchmarks disappears or loses `harness = false`.
      #
      # A benchmark document is worse than a README for rot, because its
      # numbers cannot be checked by reading the code. This is the same
      # arrangement `emit-schemas`/`check-schemas` uses, for the same reason.
      - run: cargo run -p xtask -- check-bench
      # AC-7.7 to AC-7.10, the half that reads text: a fuzz target exists for
      # every function that consumes untrusted bytes, each has committed seed
      # inputs, the `interpret` target still carries its `matched_span`
      # assertions, the fuzz package is still its own workspace (so it cannot
      # drag nightly into the pinned build or either MSRV job), and the fuzz
      # job below both runs and caches its corpus.
      #
      # It runs here, in the fast job, because it reads files. Actually
      # *running* the targets needs nightly and `cargo-fuzz` and takes
      # minutes, so it is the separate `fuzz` job below -- and the seed check
      # is here rather than there because a target with no seeds does not fail,
      # it succeeds while reaching nothing, which is the failure mode this
      # milestone already measured once in a property-test strategy.
      - run: cargo run -p xtask -- check-fuzz
      # `fuzz/` is its own workspace on purpose (three reasons, in
      # `fuzz/Cargo.toml`), and the cost is that `cargo fmt --all`, `cargo
      # clippy --workspace` and `cargo test --workspace` above never reach
      # ~900 lines of Rust. Until this step existed the compensating control
      # was a sentence in `fuzz/README.md` asking a human to remember to `cd
      # fuzz` -- the same shape as the MSRV membership rule that had no
      # executable form and three recorded recurrences, and strictly weaker
      # than the five inline gates M5 closed.
      #
      # It is an xtask subcommand rather than three steps carrying
      # `working-directory: fuzz` because `check-ci` refuses those, and
      # refuses them for this reason: from the repository root `cargo fmt
      # --all -- --check` means the root workspace, and a step that quietly
      # means a different one is a gate nobody can reproduce by typing what
      # the workflow says.
      #
      # It runs HERE, on stable: only *building* the fuzz targets needs
      # nightly. The `deny` job covers `fuzz/`'s dependency graph separately,
      # since that needs the cargo-deny action.
      - run: cargo run -p xtask -- check-fuzz-crate
      # The gate on the gates: every `run:` step in this file must be either a
      # `cargo run -p xtask -- <subcommand>` that exists or one of a small
      # named set of cargo built-ins. Closing five inline gates is not closing
      # the class; this is.
      - run: cargo run -p xtask -- check-ci

  # AC-7.8 and AC-7.10 -- the fuzz targets, actually executed.
  #
  # WHY IT HAS NO `if:`. AC-7.10 is specifically "on every pull request", and
  # a job-level condition is how that requirement gets quietly lost -- see the
  # `lab-conformance` job below, which legitimately has one and is therefore
  # exactly the shape to copy by accident. `xtask check-fuzz` fails if this
  # job grows one. The nightly-vs-PR difference is on the *duration*, not on
  # whether the job runs: 60 seconds per target on a push or pull request, 600
  # on the nightly schedule.
  #
  # WHY THE CORPUS IS CACHED. Without it every run re-derives the same shallow
  # inputs from the committed seeds and never gets past them, and a 60-second
  # run from a cold corpus is a smoke test wearing a fuzzer's name. The cache
  # key rolls with the seeds so a new seed does not inherit a corpus that
  # predates it; `restore-keys` still recovers the previous corpus, because
  # discarding a fuzzer's accumulated inputs is the one thing that makes it
  # start over. `xtask fuzz` minimises a corpus that has grown past the bound
  # in `corpus_needs_minimisation`, so the cache rolling forward for ever does
  # not eventually turn this job red for a reason that is not a bug.
  #
  # WHAT 60 SECONDS BUYS, STATED PLAINLY. It replays every committed seed and
  # every cached input before it mutates anything, so any input that has ever
  # found something is re-run on every pull request, and it explores shallowly
  # around them. It does NOT reliably find a bug that needs a deep or narrowly
  # shaped input: a one-byte span corruption in `dns.version_bind.txt_chaos.v1`
  # survived 120 s and 2.96M executions and was caught only at 600 s / 6.56M,
  # while a hand-built 33-byte input caught it instantly. That gap is closed by
  # `fuzz/seeds/interpret/span-edge-*.bin` and the workspace test over them
  # (`crates/bathy-interpret/tests/span_edge_corpus.rs`), which runs in the
  # fast job above in about a millisecond -- not by making every PR wait ten
  # minutes per target. See `fuzz/README.md` for the measurements.
  #
  # WHY `cargo install` IS ALLOWED HERE. A program that needs `cargo-fuzz`
  # cannot be what provides it -- the same reason the toolchain steps in the
  # MSRV jobs are not xtask subcommands. `RUNNABLE_WITHOUT_XTASK` in
  # `xtask/src/gates.rs` names this exact command, narrowly, with that reason.
  #
  # WHY IT IS NOT `cargo fuzz run <target>` FOUR TIMES. That would be a second
  # registry of targets, in a file nobody runs locally, and it would diverge
  # from `gates::FUZZ_SURFACES` the first time a target was added -- the same
  # defect as the MSRV membership rule that had no executable form and three
  # recorded recurrences. `xtask fuzz` iterates the one registry.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ hashFiles('fuzz/seeds/**') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ hashFiles('fuzz/seeds/**') }}-
            fuzz-corpus-
      - run: cargo install cargo-fuzz --locked
      - run: cargo run -p xtask -- fuzz --time ${{ github.event_name == 'schedule' && '600' || '60' }}

  # AC-7.2 through AC-7.6 -- the conformance suite, against the real lab.
  #
  # Five acceptance criteria were closed by named tests that die under
  # mutation and defended by nobody: nothing ran them on a push, so a
  # regression would land green and stay green until someone remembered to
  # type `lab/run.sh test`. The overview's constraint says a criterion is
  # closed by a test that dies when the code it names is removed; closed is
  # not the same as defended, and the second half is this job.
  #
  # There was never a technical obstacle. `ubuntu-latest` ships Docker and,
  # being Linux, routes to `labnet` natively -- the routing failure
  # `lab/README.md` documents is a macOS one, caused by Docker Desktop keeping
  # the daemon in a VM whose bridges the host never learns. `lab/run.sh test`
  # runs here verbatim.
  #
  # WHY NOT ON EVERY PUSH. `lab/run.sh up` pulls eight digest-pinned images,
  # about 2.8 GiB, and Docker Hub's anonymous pull-rate limit applies to
  # GitHub's shared egress addresses, so a per-PR run would be both slow and
  # intermittently rate-limited -- and a job that fails for a reason unrelated
  # to the change is a job people learn to ignore. Daily plus on-demand keeps
  # the pull volume at roughly one lab per day, comfortably inside the
  # anonymous limit, and bounds how long a regression can sit undetected to 24
  # hours. Caching the images was considered and rejected: `docker save` of
  # this set is larger than the cache is worth restoring, and the layers would
  # have to be re-validated against the pinned digests anyway, which is the
  # pull.
  #
  # WHY IT CANNOT PASS VACUOUSLY. `lab/run.sh test` sets BATHY_LAB_REQUIRED,
  # which turns the suite's "the lab is not reachable, skipping" into a hard
  # failure -- a CI job that silently skips the conformance suite is the same
  # defect as a test that silently skips itself, one level up, and that defect
  # is what AC-7.32 is about. `xtask check-lab` asserts both halves: that this
  # step exists, and that the script still sets that variable.
  lab-conformance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: lab/run.sh test

  # The MSRV is a promise to downstream consumers, so it gets its own job.
  # Without this, MSRV rots silently the first time someone uses a newer API.
  #
  # Tiered in two jobs, not one over `--workspace`: `bathy-store` (via
  # `rusqlite`'s `bundled` feature) needs a newer rustc than the rest of the
  # workspace -- see the MSRV comment on `bathy-store`'s `Cargo.toml` for the
  # exact floor and how `1.95` was measured. A single `--workspace` job
  # pinned to `1.88` would simply fail on `bathy-store` forever; splitting
  # it is what lets CI stay green while still actually verifying both
  # floors, rather than one of them being asserted in a comment and never
  # built.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: rm -f rust-toolchain.toml   # the pin says stable; this job tests the floor
      # `bathy-engine` moved OUT of this job in M3 Task 7: it now depends on
      # `bathy-store` (`TaskStore`, for `scheduler.rs`'s resumption cursor),
      # which needs a higher floor than `1.88` -- see the MSRV comment on
      # `crates/bathy-engine/Cargo.toml`. It now joins `msrv-bathy-store`
      # below instead.
      #
      # `bathy-probe` joined this job in M4 Task 1: it depends only on
      # `bathy-types` (see the MSRV comment on `crates/bathy-probe/Cargo.toml`),
      # so it stays in the `1.88` tier rather than moving to
      # `msrv-bathy-store` the way `bathy-engine` did.
      #
      # `bathy-interpret` joined this job in M4 Task 3: it depends only on
      # `bathy-types` and `regex` (see the MSRV comment on
      # `crates/bathy-interpret/Cargo.toml`), so -- like `bathy-probe` --
      # it stays in the `1.88` tier rather than `msrv-bathy-store`.
      #
      # `bathy` joined this job in the M4 whole-branch fix wave (MINOR-1)
      # and LEFT it again in M5 Task 3. It was created in M4 (`508d4f6`)
      # declaring `rust-version.workspace = true` (1.88) and was named by
      # NEITHER msrv job, so its floor was claimed and never checked -- the
      # same defect M3's review found in `bathy-plan`. It had no
      # dependencies at all then, so `1.88` was the correct tier. M5 Task 3
      # added the `[[bin]]` and with it a dependency on `bathy-engine` ->
      # `bathy-store` -> `libsqlite3-sys`, so its floor is now `1.95` and it
      # is checked in `msrv-bathy-store` below. Verified against real
      # toolchains in both directions before this line was moved: `cargo
      # +1.88 check -p bathy` fails with "bathy-store@0.1.0 requires rustc
      # 1.95" and `cargo +1.95 check -p bathy --all-targets` passes.
      #
      # The standing rule this is the second instance of: a crate declaring
      # a floor must appear in exactly one of these two jobs, and changing a
      # crate's dependencies means re-deciding which one in the same commit.
      #
      # `bathy-packetd` joined this job in M6 Task 1, and the tier is a
      # deliberate constraint rather than an observation. Its whole dependency
      # set is `serde`, `serde_json`, `thiserror` and `ipnet` -- every one of
      # them already inside `bathy-types`' 1.88-clean graph -- plus a
      # `bathy-types` DEV-dependency for the one test that pins `PortState`'s
      # wire strings, which is also 1.88. Nothing in the only privileged
      # component in this workspace is allowed to reach `bathy-store` and
      # `libsqlite3-sys`'s build script: a privileged process with a C build
      # script in its graph is a privileged process nobody can review. So
      # `--all-targets` is right here, and if this line ever has to move to
      # `msrv-bathy-store` that is a signal about the dependency graph, not
      # about the toolchain. Measured against real toolchains in both
      # directions before this line was written, the way this project has
      # required since the third recurrence: `cargo +1.88 check -p
      # bathy-packetd --all-targets` passes (so the declared floor is real and
      # this is the job that checks it) and `cargo +1.95 check -p
      # bathy-packetd --all-targets` also passes (so it is not silently a
      # 1.95 crate named in the wrong job).
      - run: cargo check -p bathy-types -p bathy-scope -p bathy-evidence -p bathy-plan -p bathy-probe -p bathy-interpret -p bathy-packetd -p xtask --all-targets
      # `bathy-query` joined this job in M5 Task 1 -- and it is the first
      # crate whose floor these two jobs, as previously written, could not
      # express. Its `[dependencies]` are `bathy-types`, `schemars`, `serde`,
      # `serde_json` and `thiserror`, every one of them already in
      # `bathy-types`' own 1.88-clean graph, so `1.88` is the floor a
      # *consumer* of the library gets and is what its `rust-version`
      # declares. That set is not a comment anyone has to remember: it is
      # pinned in `xtask`'s `PINNED_DEPENDENCIES` and `check-deps` fails on a
      # direct dependency added or removed without the pin moving with it.
      # Said "`bathy-types` and nothing else" until the M5 Task 2 residual
      # round -- true when written in M5 Task 1, false from M5 Task 2, and
      # not an incidental mention: it is the premise of this whole split.
      # `PINNED_DEPENDENCIES` is what stops the premise rotting again; it
      # cannot check this sentence, so the sentence points at it instead of
      # restating it.
      #
      # Its `[dev-dependencies]` are another matter:
      # `tests/real_log_fold.rs` folds a log produced by a REAL scan, which
      # needs `bathy-engine` -> `bathy-store` -> `libsqlite3-sys`, whose
      # build script needs `1.95`.
      #
      # Both floors are real and both are now checked, in the job that can
      # actually check each:
      #
      #   - here, WITHOUT `--all-targets`: the library floor, which is the
      #     only one a downstream consumer ever experiences and the only one
      #     `rust-version` governs. `--all-targets` would build the dev-deps
      #     and turn this into a check of the test harness instead.
      #   - in `msrv-bathy-store` below, WITH `--all-targets`: the floor the
      #     test harness needs.
      #
      # Root cause, stated because a future crate will hit it again: these
      # two jobs previously assumed every crate has exactly one floor, and a
      # crate whose tests reach further down the stack than its library does
      # has two. Naming `bathy-query` in only one of them would have made a
      # claim nobody checks -- the precise defect M3 found in `bathy-plan`
      # and M4 reintroduced in `crates/bathy`. Verified against real 1.88 and
      # 1.95 toolchains before being written here: `cargo +1.88 check -p
      # bathy-query` passes and `cargo +1.88 check -p bathy-query
      # --all-targets` fails with "bathy-engine@0.1.0 requires rustc 1.95".
      - run: cargo check -p bathy-query

  msrv-bathy-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - run: rm -f rust-toolchain.toml   # the pin says stable; this job tests the floor
      # `bathy-engine` joined this job in M3 Task 7 (see the MSRV comment on
      # its `Cargo.toml`): it now depends on `bathy-store` transitively via
      # `scheduler.rs`'s `TaskStore` usage, so it needs this same `1.95`
      # floor to build at all, not just `bathy-store` itself.
      #
      # `bathy-query` is here for its TEST targets only; its library floor is
      # `1.88` and is checked in the `msrv` job above. See the longer note
      # there for why one crate is named in both jobs.
      #
      # `bathy` joined this job in M5 Task 3, when it gained a `[[bin]]` and
      # with it a dependency on `bathy-engine`. Unlike `bathy-query` it has
      # only one floor: its library, its binary and its tests all reach
      # `bathy-store`, so `1.95` is what a `cargo install bathy` user needs
      # too, and it is named here and nowhere else.
      #
      # `bathy-mcp` joined this job in M5 Task 4, AGAINST what the plan said.
      # The plan put it in the `1.88` `msrv` job because `rmcp` declares
      # `rust-version = "1.88"`, but the SDK's floor is a lower bound on this
      # crate's rather than its value: `bathy-mcp` is an adapter over the
      # engine, so it reaches `bathy-store` and needs `1.95`. Verified by
      # execution before this line was written, in both directions:
      # `cargo +1.88 check -p bathy-mcp` fails with "bathy-mcp@0.1.0 requires
      # rustc 1.95", and `cargo +1.95 check -p bathy-mcp --all-targets`
      # passes. This is the third crate in this project to be given a floor
      # nothing checked -- M3 found `bathy-plan`, M4 reintroduced it with
      # `crates/bathy` -- which is why the measurement is recorded rather
      # than the conclusion.
      - run: cargo check -p bathy-store -p bathy-engine -p bathy-query -p bathy -p bathy-mcp --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `command:` and `arguments:` were both absent, so what ran here was the
      # action's built-in default -- written down nowhere in this repository,
      # free to change under a floating `@v2`, and impossible to reproduce
      # locally because nobody could say what it was. The four checks are now
      # named, `xtask check-deny` runs exactly these four, and
      # `gates::deny_job_violations` fails if the two ever differ.
      #
      # WHICH INPUT THE CHECK NAMES GO IN. `command-arguments:`, not
      # `arguments:`. The action splices its inputs as
      #
      #   cargo-deny --log-level L --manifest-path M <arguments> <command> \
      #              <command-arguments>
      #
      # so the four check names sat BEFORE the subcommand for a milestone,
      # producing `cargo-deny ... advisories bans licenses sources check` --
      # which exits 2 with `unrecognized subcommand 'advisories'`. Measured
      # against `cargo-deny 0.20.2` rather than reasoned about. The previous
      # checker compared that list to its own and found it equal: it checked
      # the spelling of a set and never the position it was spelled in.
      # `arguments:` is the global-flag slot and carries `--all-features`,
      # which decides which crates are in the graph at all -- so the local
      # command passes it too.
      #
      # Still open, deliberately: `@v2` floats. Pinning it to a commit SHA is
      # the correct fix and is not made here because the SHA has to be
      # verified against the upstream repository rather than guessed; the
      # substantive half -- what actually runs -- no longer floats.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml
          arguments: --all-features --config deny.toml
          command: check
          command-arguments: advisories bans licenses sources
      # The second graph. `fuzz/` is its own workspace, so `cargo metadata` at
      # the root lists twelve packages and none of them is `bathy-fuzz`: this
      # job never saw `libfuzzer-sys`, `arbitrary` or `ipnet`, and no advisory
      # or licence check ever ran over them. The first run that did point here
      # found `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA` -- a licence
      # in nobody's allow list. `deny.toml` now carries a scoped exception
      # with the ruling. `--config deny.toml` because cargo-deny defaults its
      # config to `<cwd>/deny.toml`, and one policy for both graphs is the
      # point.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features --config deny.toml
          command: check
          command-arguments: advisories bans licenses sources
