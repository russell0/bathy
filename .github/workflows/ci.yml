name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p xtask -- check-deps
      - run: cargo run -p xtask -- check-schemas
      - name: no direct time/id generation outside Clock (AC-2.1)
        run: |
          # `Clock` (crates/bathy-types/src/clock.rs) is the only place
          # permitted to call `SystemTime::now()` or construct a random ULID
          # (`ulid::Generator`, or `Ulid::new()` should a future `ulid`
          # version reintroduce it). Injecting both through `Clock` is what
          # makes an event log byte-comparable between a recorded run and a
          # replayed one; any other call site breaks that guarantee.
          ! grep -rnE --include='*.rs' 'SystemTime::now\(\)|ulid::Generator|Ulid::new\(' crates/ xtask/ \
            | grep -v '^crates/bathy-types/src/clock\.rs:'
      - name: no unsafe outside packetd
        run: |
          # Matches `unsafe` followed by a space, `{`, `(`, or end-of-line, so
          # `unsafe fn`, `unsafe{`, `unsafe(no_mangle)`, and a bare trailing
          # `unsafe` are all caught, not just the space-delimited form. Scans
          # both crates/ and xtask/ — the binding constraint is "no crate
          # outside bathy-packetd", not "no crate under crates/ outside
          # bathy-packetd".
          #
          # `\b` leading word boundary: without it, `unsafe` matches as a
          # plain substring, so `let is_unsafe = true;` (word char `_`
          # immediately before `unsafe`, then a space) false-positives and
          # trips this check on legitimate code. `\b` requires a transition
          # from a non-word character (or start of line) into `u`, which
          # `is_unsafe` never has — GNU grep (this job runs on ubuntu-latest)
          # supports `\b` as an extension in -E mode.
          ! grep -rnE --include='*.rs' '\bunsafe([ {(]|$)' crates/ xtask/ \
            | grep -v '^crates/bathy-packetd/'
      - name: bathy-interpret's dependency tree is pure (AC-4.10)
        run: |
          # `bathy-interpret` (M4 Task 3) may depend on `bathy-types` and
          # `regex` only -- no async runtime, no filesystem access, no
          # clock, no randomness of its own. That constraint is what lets
          # M4 Task 4's replay corpus run with the network interface down
          # and M7's fuzz target run without sockets (see that crate's own
          # `src/lib.rs` doc comment). Checked two ways, by execution
          # against the real dependency graph rather than by inspecting the
          # Cargo.toml alone (a comment or a stray `path = ...` drifting out
          # of sync with reality would not be caught by reading the
          # manifest):
          #
          # 1. The *direct* dependency set must be exactly {bathy-types,
          #    regex} -- nothing added, nothing silently dropped.
          direct=$(cargo tree -p bathy-interpret --edges normal --depth 1 --prefix none \
            | tail -n +2 | awk '{print $1}' | sort)
          expected=$(printf 'bathy-types\nregex\n' | sort)
          if [ "$direct" != "$expected" ]; then
            echo "bathy-interpret's direct dependencies changed:"
            echo "  got:  $(echo "$direct" | tr '\n' ' ')"
            echo "  want: $(echo "$expected" | tr '\n' ' ')"
            exit 1
          fi
          # 2. Nothing in the *whole* tree (direct + transitive) is an
          #    async runtime, filesystem, or clock-touching crate this
          #    pure, in-memory byte-matching decision has no business
          #    reaching -- guards against a *transitive* dependency of
          #    `bathy-types` or `regex` growing one of these in the future
          #    without anyone noticing.
          ! cargo tree -p bathy-interpret --edges normal --prefix none \
            | grep -iE '^(tokio|tokio-util|mio|async-trait|fs4|rusqlite|libsqlite3-sys|walkdir|tempfile|filetime)( |$)'
      # Lines that legitimately name the phrase — this rule, its tests, its
      # enforcement — carry the [phrase-rule] marker and are excluded. Without
      # that exclusion this step fails on its own source. See the overview's
      # sentinel convention.
      - name: forbidden determinism claim
        run: |
          # Bracket expression matches the phrase without this line containing it.
          ! grep -rniIE "deterministic[ ]results" . --exclude-dir=target --exclude-dir=.git \
            | grep -v '\[phrase-rule\]'
  # The MSRV is a promise to downstream consumers, so it gets its own job.
  # Without this, MSRV rots silently the first time someone uses a newer API.
  #
  # Tiered in two jobs, not one over `--workspace`: `bathy-store` (via
  # `rusqlite`'s `bundled` feature) needs a newer rustc than the rest of the
  # workspace -- see the MSRV comment on `bathy-store`'s `Cargo.toml` for the
  # exact floor and how `1.95` was measured. A single `--workspace` job
  # pinned to `1.88` would simply fail on `bathy-store` forever; splitting
  # it is what lets CI stay green while still actually verifying both
  # floors, rather than one of them being asserted in a comment and never
  # built.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: rm -f rust-toolchain.toml   # the pin says stable; this job tests the floor
      # `bathy-engine` moved OUT of this job in M3 Task 7: it now depends on
      # `bathy-store` (`TaskStore`, for `scheduler.rs`'s resumption cursor),
      # which needs a higher floor than `1.88` -- see the MSRV comment on
      # `crates/bathy-engine/Cargo.toml`. It now joins `msrv-bathy-store`
      # below instead.
      #
      # `bathy-probe` joined this job in M4 Task 1: it depends only on
      # `bathy-types` (see the MSRV comment on `crates/bathy-probe/Cargo.toml`),
      # so it stays in the `1.88` tier rather than moving to
      # `msrv-bathy-store` the way `bathy-engine` did.
      #
      # `bathy-interpret` joined this job in M4 Task 3: it depends only on
      # `bathy-types` and `regex` (see the MSRV comment on
      # `crates/bathy-interpret/Cargo.toml`), so -- like `bathy-probe` --
      # it stays in the `1.88` tier rather than `msrv-bathy-store`.
      - run: cargo check -p bathy-types -p bathy-scope -p bathy-evidence -p bathy-plan -p bathy-probe -p bathy-interpret -p xtask --all-targets

  msrv-bathy-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - run: rm -f rust-toolchain.toml   # the pin says stable; this job tests the floor
      # `bathy-engine` joined this job in M3 Task 7 (see the MSRV comment on
      # its `Cargo.toml`): it now depends on `bathy-store` transitively via
      # `scheduler.rs`'s `TaskStore` usage, so it needs this same `1.95`
      # floor to build at all, not just `bathy-store` itself.
      - run: cargo check -p bathy-store -p bathy-engine --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
