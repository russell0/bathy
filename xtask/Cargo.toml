[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
# `bench-compare` writes `bench/results.json` and `check-bench` reads it back
# and re-renders `docs/benchmarks.md` from it. Derive, rather than hand-rolled
# `serde_json::Value` walking: the record has eleven fields per run and a
# typo in one of them would silently publish a table with a column missing.
# `serde` is already in this workspace's tree and is a 1.88-tier dependency,
# so this keeps `xtask` in the `msrv` job.
serde = { workspace = true }
# xtask is not part of the crates/ layer order (see LAYERS in src/main.rs) and
# is allowed to depend on it for schema emission/drift-checking; check-deps'
# forbidden-substring rule still applies to it like any other workspace
# member.
bathy-types = { path = "../crates/bathy-types" }
# `check-readme` (src/readme.rs) proves README.md's protocol claims against
# `ProbeRegistry::standard()` by CALLING it, not by parsing framework.rs: the
# set of probes that exist is then compile-checked, and adding a ninth probe
# fails the check with its id named instead of quietly leaving the README's
# "eight protocols" wrong for a milestone. `bathy-probe` is a 1.88-tier crate
# (its only dependency is `bathy-types`), so this edge keeps `xtask` in the
# `msrv` CI job rather than dragging it up to the 1.95 tier -- which is also
# why the evidence caps, owned by the 1.95-tier `bathy-engine`, are read from
# source text instead.
bathy-probe = { path = "../crates/bathy-probe" }
# `check-readme` pins the README's "thirteen interpretation rules" by CALLING
# `all_rules()`, for the same reason it calls `ProbeRegistry::standard()`
# rather than parsing `rules.rs`: the count is then compile-checked, and a
# fourteenth rule fails the check instead of quietly leaving the limitations
# section -- the paragraph a sceptical reader weighs hardest -- understating
# what this project can identify. `bathy-interpret` is a 1.88-tier crate (its
# only dependencies are `bathy-types` and `regex`), so this edge keeps `xtask`
# in the `msrv` CI job. `bathy-mcp`, which owns the eleven tool names, is
# 1.95-tier and cannot be added on those terms, so `TOOL_NAMES` is read from
# source text instead -- the same trade the evidence caps make.
bathy-interpret = { path = "../crates/bathy-interpret" }
# `check-schemas`/`emit-schemas` merges this crate's two published schemas
# (`ScanFold`, `ScanDiff`, M5 Task 2 AC-5.35) with `bathy-types`'s four.
# `schemars::schema_for!` needs the concrete type, and these two are defined
# in `bathy-query`. It is a 1.88-tier library (its dependencies are
# `bathy-types`, `serde`, `serde_json` and `schemars`), so this edge keeps
# `xtask` in the `msrv` CI job -- verified by execution, see the M5 Task 2
# report.
bathy-query = { path = "../crates/bathy-query" }
# `check-readme` matches every phrasing of a pinned claim across the whole
# document, so that a number corrected in two places out of three fails. That
# is regex work; `regex` is already in this workspace's tree via
# `bathy-interpret` and needs no exemption from check-deps' forbidden-substring
# rule.
regex = { workspace = true }
# `gen-ports`: the IANA registry CSV embeds commas, quotes, and (in a handful
# of multi-paragraph Description fields) literal newlines inside quoted
# fields -- verified against the real downloaded file, see the task report.
# A naive `split(',')` breaks on exactly those rows. `csv` is only a
# dependency of this dev tool, not of any crate on the scan path, so it needs
# no entry in `LAYERS` and no exemption from `check-deps`'s forbidden-
# substring rule (it isn't a model/inference client).
csv = "1"

[dev-dependencies]
# Scratch directories for the gate tests that build a fake repository tree
# and walk it. Hand-built `std::env::temp_dir().join(format!("...-{pid}"))`
# names were used here until two of them collided: `gates.rs` and
# `phrases.rs` each have a `walk`, each had a test for it with the same
# name, and both computed the identical path and both `remove_dir_all`'d it
# -- concurrently, in this one test binary. A pid is unique per process, and
# the thing that has to be unique here is a test. `tempfile` makes the name
# unique by construction rather than by inspection, and removes the tree on
# the panic paths too. Already in this workspace's tree (six crates use it),
# so this adds no crate to the graph, and it is a `[dev-dependencies]` edge:
# nothing `xtask` ships to CI links it.
tempfile = { workspace = true }
