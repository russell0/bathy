[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/russell0/bathy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
blake3 = "1"
ulid = "3"
ipnet = { version = "2", features = ["serde"] }
proptest = "1"
time = { version = "0.3", features = ["parsing"] }
tempfile = "3.27"
walkdir = "2.5"
# `fallible_uint`: this store's schema uses `u64` throughout (packet/probe
# counts, unit indices); without this feature rusqlite 0.40.1 does not
# implement `ToSql`/`FromSql` for `u64` at all (verified against the
# installed source, crates/bathy-store's task report has the details), not
# just less strictly.
#
# `bundled`: vendors and compiles SQLite from source so no system SQLite
# library is required on a contributor machine or in CI -- deliberate, so
# `cargo test` stays reproducible without an OS package manager step.
#
# KNOWN MSRV CONFLICT, verified concretely (not assumed): with `bundled`
# enabled, `libsqlite3-sys` 0.38.1's build script (the only version on
# crates.io satisfying rusqlite 0.40.1's `^0.38.1` requirement) invokes the
# `cfg_select!` macro, which this workspace's declared `rust-version = "1.85"`
# does not have -- confirmed by running `rustup run 1.85.0 cargo check
# --workspace --all-targets`, which fails with "cannot find macro
# `cfg_select`". `cfg_select!` is unstable-gated as of 1.90.0 and fully
# stable by 1.97.1, i.e. it needs a rustc well above 1.85. This is an
# upstream `libsqlite3-sys` implementation detail, not something a code
# change in this workspace can fix; dropping `bundled` would restore MSRV
# compliance but reintroduce the system-SQLite dependency this feature
# exists to avoid (and CI's `test` job would then need a new
# `apt-get install libsqlite3-dev` step, since ubuntu-latest does not ship
# one). Left as `bundled` deliberately -- see crates/bathy-store's task
# report for the full tradeoff -- so CI's dedicated `msrv` job (pinned to
# literal Rust 1.85) is expected to fail on this dependency alone until
# either libsqlite3-sys changes its bundled build script or the workspace's
# MSRV floor is revisited; that is a project-wide decision this task does
# not make unilaterally.
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
