[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
# Every publishable crate in this workspace carries THIS version and no other
# -- see `xtask check-release`, which fails if any of them disagrees. The
# lockstep is not tidiness: `bathy` is an alpha, and a `bathy-engine` released
# as a bare `0.1.0` beside it would carry a stronger compatibility promise
# than the binary that is its only consumer. Cargo treats `0.1.0` as a release
# and `0.1.0-alpha.N` as a pre-release it will not select without an explicit
# opt-in, so the pre-release suffix is the part that keeps the promise honest.
#
# `alpha.2`, not `alpha.1`: `bathy 0.1.0-alpha.1` is ALREADY on crates.io as a
# lib-only name reservation. A version on crates.io cannot be replaced, only
# yanked, so the first release that actually ships the binary has to be a new
# version. Bumping the whole workspace rather than only `bathy` is what keeps
# the lockstep true.
version = "0.1.0-alpha.2"
edition = "2024"
# 1.88, not the lowest number that happens to build: the patched `time`
# release that fixes RUSTSEC-2026-0009 (stack exhaustion via RFC 2822
# parsing, see the `time` entry below) declares `rust-version = 1.88`.
# Cargo's resolver is MSRV-aware over the workspace floor, so anything
# lower pins `time` back to the vulnerable 0.3.45. This floor previously
# read 1.85 for no reason other than matching edition 2024's own minimum --
# an arbitrary number with no consumer requiring it, which is exactly what
# let it block a security patch. Don't lower this without checking whether
# `time` (or whatever replaces it as the reason) still needs 1.88.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/russell0/bathy"

[workspace.dependencies]
# --- This workspace's own crates. ---
#
# `version` beside `path` is what makes them publishable AT ALL, and its
# absence is not a warning: `cargo publish` refuses outright with "all
# dependencies must have a version requirement specified when publishing",
# because the published manifest has the `path` stripped out and would
# otherwise name a dependency with no way to resolve it. Every one of these
# edges lacked a version until the release workflow was built, so every crate
# above `bathy-types` was unpublishable and nothing said so.
#
# Declared here rather than inline in each member because the version has to
# match `[workspace.package].version` above, in all 33 places these edges
# appear. One place to change is one place to get wrong; `xtask check-release`
# still verifies the match, because "it is obviously the same string" is how
# the other lists in this repository rotted.
#
# `[dev-dependencies]` edges deliberately keep their bare `path` form and are
# NOT listed here. Cargo strips a versionless dev-dependency out of the
# published manifest entirely, which is exactly right for a workspace-internal
# test helper: `bathy-query`'s six dev-dependencies are how its tests build a
# real engine, and no consumer of the published crate needs them to resolve.
bathy-types = { path = "crates/bathy-types", version = "0.1.0-alpha.2" }
bathy-scope = { path = "crates/bathy-scope", version = "0.1.0-alpha.2" }
bathy-evidence = { path = "crates/bathy-evidence", version = "0.1.0-alpha.2" }
bathy-store = { path = "crates/bathy-store", version = "0.1.0-alpha.2" }
bathy-plan = { path = "crates/bathy-plan", version = "0.1.0-alpha.2" }
bathy-interpret = { path = "crates/bathy-interpret", version = "0.1.0-alpha.2" }
bathy-probe = { path = "crates/bathy-probe", version = "0.1.0-alpha.2" }
bathy-engine = { path = "crates/bathy-engine", version = "0.1.0-alpha.2" }
bathy-query = { path = "crates/bathy-query", version = "0.1.0-alpha.2" }
bathy-mcp = { path = "crates/bathy-mcp", version = "0.1.0-alpha.2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
# M4 Task 3 (`crates/bathy-interpret`): the pure rule engine matches
# protocol banners against patterns like `^Server:[ \t]*nginx(?:/(...))?`
# via `regex::Regex`, compiled once per rule via `std::sync::LazyLock`
# rather than per call (see that crate's `src/rules.rs`). Default features
# only -- no `logging`, `pattern`, or other extras `bathy-interpret` doesn't
# use. `regex` and its transitive deps (`regex-automata`, `regex-syntax`,
# `aho-corasick`, `memchr`) are pure computation over in-memory byte slices:
# no filesystem, clock, network, or randomness, which is exactly what keeps
# `bathy-interpret`'s dependency tree pure per AC-4.10.
regex = "1.13"
blake3 = "1"
ulid = "3"
ipnet = { version = "2", features = ["serde"] }
proptest = "1"
time = { version = "0.3", features = ["parsing"] }
tempfile = "3.27"
walkdir = "2.5"
# C5: advisory whole-file locking for `EventLog::open`'s writer-exclusion
# guarantee. Pure Rust (no libc), so it doesn't conflict with `#[forbid(unsafe_code)]`
# in `bathy-evidence`; `sync` is the only feature enabled -- no async runtime
# is pulled in. `File::try_lock`/`lock`/`unlock` were only stabilized in std
# as of Rust 1.89, above this workspace's declared MSRV floor for the crates
# that need this (`bathy-evidence` stays at 1.88 -- see the MSRV tiering
# comment on `bathy-store`'s `Cargo.toml`), so std's own API isn't an option
# here.
fs4 = { version = "1", default-features = false, features = ["sync"] }
# `fallible_uint`: this store's schema uses `u64` throughout (packet/probe
# counts, unit indices); without this feature rusqlite 0.40.1 does not
# implement `ToSql`/`FromSql` for `u64` at all (verified against the
# installed source, crates/bathy-store's task report has the details), not
# just less strictly.
#
# `bundled`: vendors and compiles SQLite from source so no system SQLite
# library is required on a contributor machine or in CI -- deliberate, so
# `cargo test` stays reproducible without an OS package manager step.
#
# MSRV, tiered rather than a workspace-wide conflict: `bundled`'s
# `libsqlite3-sys` 0.38.1 build script needs a rustc with `cfg_select!`
# (stable at 1.97.1, present but unstable-gated from 1.90; simply absent at
# this workspace's declared floor of 1.88). Rather than raise the whole
# workspace's MSRV for one dependency only `bathy-store` uses, `bathy-store`
# declares its own literal, higher `rust-version` -- see the comment on it
# in `crates/bathy-store/Cargo.toml` for the exact floor and how it was
# measured. CI verifies both floors with two separate jobs
# (`.github/workflows/ci.yml`): `msrv` at `1.88` over the crates that still
# need only that (`bathy-types`, `bathy-scope`, `bathy-evidence`,
# `bathy-plan`, and `xtask`), and `msrv-bathy-store` at `1.95` for
# `bathy-store` and `bathy-engine` (which depends on it -- see the MSRV
# comment on `crates/bathy-engine/Cargo.toml`. M3 whole-branch review,
# MINOR: this comment previously still listed `bathy-engine` in the `1.88`
# tier after it had already moved to `1.95` in `ci.yml` and in its own
# `Cargo.toml` -- stale documentation, not a stale gate; `ci.yml` itself was
# always correct).
rusqlite = { version = "0.40.1", features = ["bundled", "fallible_uint"] }
# `bathy-engine`'s token-bucket rate limiter (`crates/bathy-engine/src/rate.rs`)
# needs `time` (Instant/Duration/sleep) and, for its own test module,
# `macros` (`#[tokio::test]`) and `rt` (the current-thread runtime that
# attribute builds). `sync` is enabled here too because it is expected to be
# load-bearing for the budget-governed emission work later in the same
# crate (M3 Task 7 -- the scheduler, which shares state across concurrent
# acquirers) rather than for anything in this task. (Corrected from an
# earlier version of this comment that named "M3 Task 8" -- the plan this
# workspace follows has no such task; Task 7, the scheduler, is the very
# next one and is exactly the "budget-governed emission work" referred to
# here.) `net` (added for M3 Task 5, `crates/bathy-engine/src/connect.rs`)
# is what actually gives `tokio::net::TcpStream`/`TcpListener` --
# unprivileged TCP connect probing is the first code in the workspace that
# touches a socket at all.
# Explicitly still not `full`: that would also pull in `fs`, `process`,
# `signal`, and more that nothing in the workspace uses yet.
tokio = { version = "1.53", features = ["time", "sync", "rt", "macros", "net"] }
# M3 Task 7 (the scheduler, `crates/bathy-engine/src/scheduler.rs`) needs
# `tokio_util::sync::CancellationToken` for cooperative, promptly-observable
# cancellation of a running scan (AC-3.25) -- `tokio::sync` alone has no
# broadcast-style "please stop" primitive that a `select!` can race a
# blocking wait against. `default-features = false` plus a minimal `rt`
# feature (verified directly against this workspace's exact tokio-util
# 0.7 release: `CancellationToken` lives in `tokio_util::sync`, gated by
# the `rt` feature, not `sync` -- confirmed by compiling against each
# candidate feature set before settling on this one, not assumed) --
# deliberately not `full`, which would also pull in `codec`/`io`/`net`/
# `time`/`compat`, none of which anything in this workspace uses.
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# M4 Task 1 (`crates/bathy-probe/src/framework.rs`): the `Probe` trait is
# used as a trait object -- `ProbeRegistry` holds `Vec<Box<dyn Probe>>`, and
# `select_probes` returns `Vec<&dyn Probe>` -- so `execute` can't be a
# native `async fn` in the trait: that desugars to a `-> impl Future`
# return, and an opaque `impl Trait` return type is not dyn-compatible, so
# `Box<dyn Probe>` would not compile. `#[async_trait]` rewrites the method
# to return `Pin<Box<dyn Future<Output = ...> + Send>>` instead, which *is*
# object-safe, at the cost of one heap allocation per `execute` call --
# negligible next to the network I/O each call already does. Not a
# workspace dependency before this task. Pinned at 0.1.91, the latest
# release as of M4 Task 1 (MIT OR Apache-2.0, `rust-version = "1.71"` --
# well under this workspace's `1.88` floor, so it does not push
# `bathy-probe` into a higher MSRV tier; both allowed by `deny.toml`).
async-trait = "0.1.91"
# M5 Task 3 (`crates/bathy`, the `bathy` binary): the command tree, its
# argument types, and the `--help` text that carries the exit-code contract
# (AC-5.11). `derive` only. `wrap_help` is deliberately not enabled -- see
# the note on the dependency in `crates/bathy/Cargo.toml`. MIT OR
# Apache-2.0, `rust-version = "1.74"`, well under this workspace's floor,
# so it does not push `bathy` into a higher MSRV tier (`bathy-engine` does
# that; see `crates/bathy/Cargo.toml`).
clap = { version = "4.6", features = ["derive"] }
# M7 Task 3 (AC-7.15): the criterion micro-benchmarks over `interpret`,
# `canonical_json`, plan construction and event-log append. A dev-dependency
# of four 1.88-tier crates, which is why the version floor matters: the
# `msrv` CI job builds those crates with `--all-targets`, so criterion is
# compiled at 1.88 and anything needing more turns that job red.
#
# `default-features = false` drops `plotters` (HTML report rendering, which
# pulls a chart stack this project has no use for) and `rayon` (a thread pool
# for the analysis phase). `cargo_bench_support` is the feature that lets
# `cargo bench` drive the harness at all; without it criterion refuses to run
# outside its own CLI. Fewer crates in the graph is also fewer licences for
# `cargo deny` to rule on, and the graph a benchmark drags in is a graph the
# shipped binary never links.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }
# M6 Task 2 (`crates/bathy-packetd`, the only privileged component): the raw
# sockets and the capability drop. All three are in exactly one crate's
# dependency table and must stay there -- see the long comment in
# `crates/bathy-packetd/Cargo.toml` for why that graph is deliberately the
# shortest in the workspace.
#
# `socket2` 0.6: `Socket::new(Domain::IPV4, Type::RAW, ..)`, `IP_HDRINCL`, and
# `getsockopt(SO_TYPE)`. MIT OR Apache-2.0, `rust-version = "1.70"`, no build
# script, `libc` its only dependency on unix.
#
# `features = ["all"]` is required, not decorative: `Type::RAW` and
# `set_header_included_v4` are both behind it, and without it this crate does
# not compile. The feature does not pull in another dependency -- socket2 has
# none beyond `libc` on unix -- it only un-gates the API surface.
socket2 = { version = "0.6", features = ["all"] }
# `caps` 0.5: `capset(2)` over all five capability sets, behind a safe API, so
# the drop needs no `unsafe` of its own. MIT OR Apache-2.0,
# `rust-version = "1.63"`, `libc` its only non-optional dependency, no build
# script. Linux-only by construction; `bathy-packetd` takes it through a
# `cfg(target_os = "linux")` target table.
caps = { version = "0.5.6", default-features = false }
# `libc` for one syscall: `prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0)`, which
# neither `socket2` nor `caps` exposes and which is what makes the capability
# drop irrevocable. It is already a transitive dependency of both, so this
# adds no crate to the privileged binary's graph.
libc = "0.2"
